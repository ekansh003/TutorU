<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} Tutor U {% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />

    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="tutoru-navbar">
      <div class="tutoru-nav-inner">
        <a href="{{ url_for('home') }}" class="tutoru-brand">
          <span class="tutoru-wordmark">TutorU</span>
        </a>

        <div class="tutoru-nav-actions">
          <a href="{{ url_for('home') }}" class="tutoru-nav-link">
            Dashboard
          </a>

          <a href="{{ url_for('new_course') }}" class="tutoru-new-course">
            <span>+</span>
            New Course
          </a>
        </div>
      </div>
    </nav>

    <main class="tutoru-main">
      <div class="tutoru-container">{% block content %}{% endblock %}</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
